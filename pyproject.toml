[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canary-scan"
version = "0.1.0"
description = "Static security scanner for LLM and AI-agent applications."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jean-Cédrik Dorélas" }]
keywords = [
    "security", "llm", "ai", "static-analysis", "prompt-injection",
    "sast", "appsec", "secrets-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []  # zero runtime deps — stdlib only, by design

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/jcedrik/canary"
Issues = "https://github.com/jcedrik/canary/issues"

[project.scripts]
canary = "canary.cli:main"

[tool.setuptools.packages.find]
include = ["canary*"]
exclude = ["tests*", "examples*"]
