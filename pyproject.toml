[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "canary-sast"
version = "0.2.0"
description = "Static security scanner for LLM and AI-agent applications."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jean-Cédrik Dorélas" }]
keywords = [
    "security", "llm", "ai", "static-analysis", "prompt-injection",
    "sast", "appsec", "secrets-detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []  # zero runtime deps — stdlib only, by design

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/jcedrik/canary"
Issues = "https://github.com/jcedrik/canary/issues"

[project.scripts]
canary = "canary.cli:main"

[tool.setuptools.packages.find]
include = ["canary*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Keep `Optional[...]` / `Type[...]`: the package supports Python 3.9.
ignore = ["UP006", "UP007", "UP035", "UP045", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
